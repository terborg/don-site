arazzo: 1.1.0
info:
  title: Aansluitprofiel OpenVTB Taken API
  summary: Workflowmapping voor OpenVTB Taken API naar InteractieServices API.
  version: 0.1.0
sourceDescriptions:
  - name: mijnTakenFunctioneelModel
    url: ../../../specificaties/functionele-modellen/mijn-taken/v0.1/openapi.yaml
    type: openapi
  - name: interactieservicesApi
    url: ../../../specificaties/interactieservices-api/v0.1/openapi.yaml
    type: openapi
  - name: openvtbTakenApi
    url: ./openapi.yaml
    type: openapi
workflows:
  - workflowId: openvtbTakenApi.zoekContextTaken
    summary: Vul taken in zoekContext vanuit OpenVTB Taken API.
    description: |
      Deze workflow beschrijft hoe taken uit de OpenVTB Taken API kunnen worden
      opgehaald om het taken-deel van de InteractieServices-operatie zoekContext
      te vullen.
    x-mijnservices-targetOperationId: interactieservicesApi.zoekContext
    x-mijnservices-flowId: mijnTaken.contextZoeken
    x-mijnservices-status: ontwerp
    steps:
      - stepId: listExterneTaken
        description:
          Haal generieke taken op die als taken in de contextresponse kunnen
          worden aangeboden.
        operationId: externetakenList

  - workflowId: openvtbTakenApi.raadpleegTaak
    summary: Raadpleeg een taak vanuit OpenVTB Taken API.
    description: |
      Deze workflow beschrijft hoe een taak via de generieke externe-takenresource
      uit de OpenVTB Taken API wordt opgehaald. De response is polymorf: het veld
      `taakSoort` bepaalt of het detail een betaaltaak, urltaak of formuliertaak is.
    x-mijnservices-targetOperationId: interactieservicesApi.retrieveTaak
    x-mijnservices-flowId: mijnTaken.taakRaadplegen
    x-mijnservices-status: ontwerp
    x-mijnservices-domainObject: mijnTakenFunctioneelModel.Taak
    inputs:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
          format: uuid
          description: Identificatie van de taak die wordt geraadpleegd.
    steps:
      - stepId: retrieveTaak
        description:
          Haal de generieke taak op die als taakdetail kan worden aangeboden.
        operationId: externetakenRetrieve
        parameters:
          - name: uuid
            in: path
            value: $inputs.uuid
    outputs:
      result:
        uuid: $steps.retrieveTaak.response.body#/uuid
        titel:
          nl: $steps.retrieveTaak.response.body#/titel
        toelichting:
          nl: $steps.retrieveTaak.response.body#/toelichting
        status: $steps.retrieveTaak.response.body#/status
        deadline: $steps.retrieveTaak.response.body#/einddatumHandelingsTermijn
        context:
          urn: $steps.retrieveTaak.response.body#/isGerelateerdAan/0
        uitvoering:
          type: $steps.retrieveTaak.response.body#/handelingsPerspectief
          fallbackUrl: $steps.retrieveTaak.response.body#/url
      source:
        taakSoort: $steps.retrieveTaak.response.body#/taakSoort

version: 0.1.0
expressionLanguage: jsonata
workflowMappings:
  - workflowId: openvtbTakenApi.raadpleegTaak
    targetOperationId: interactieservicesApi.retrieveTaak
    outputMappings:
      - target: taak.deadline
        source: $steps.retrieveTaak.outputs.einddatumHandelingsTermijn
        expression: |
          $toEndOfDayDateTime($, "Europe/Amsterdam")
        description: |
          OpenVTB Taken API levert einddatumHandelingsTermijn als kalenderdatum.
          InteractieServices API verwacht deadline als date-time. Gebruik het
          einde van de opgegeven dag in Europe/Amsterdam als deadline.
      - target: taak.status
        source: $steps.retrieveTaak.outputs.taakStatus
        expression: |
          {
            "open": "open",
            "uitgevoerd": "afgerond",
            "verwerkt": "afgerond",
            "afgebroken": "geannuleerd",
            "niet_uitgevoerd": "geannuleerd"
          }[$]
